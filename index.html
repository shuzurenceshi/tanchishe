<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Arial', sans-serif;
        }
        .game-container {
            text-align: center;
        }
        h1 {
            color: #4ade80;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .score-board {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 15px;
            color: #fff;
            font-size: 18px;
        }
        .score-item {
            background: rgba(0,0,0,0.3);
            padding: 8px 20px;
            border-radius: 20px;
        }
        .score-item span {
            color: #4ade80;
            font-weight: bold;
        }
        #gameCanvas {
            border: 3px solid #4ade80;
            border-radius: 10px;
            background: #0f172a;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }
        .btn-start {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: white;
        }
        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.4);
        }
        .btn-pause {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }
        .btn-pause:hover {
            transform: scale(1.05);
        }
        .instructions {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
        .mobile-controls {
            display: none;
            margin-top: 15px;
            gap: 5px;
        }
        .mobile-btn {
            width: 60px;
            height: 60px;
            font-size: 24px;
            background: rgba(74, 222, 128, 0.3);
            border: 2px solid #4ade80;
            color: #4ade80;
            border-radius: 10px;
        }
        .mobile-btn:active {
            background: rgba(74, 222, 128, 0.6);
        }
        @media (max-width: 500px) {
            .mobile-controls {
                display: grid;
                grid-template-areas: 
                    ". up ."
                    "left . right"
                    ". down .";
            }
            .mobile-btn.up { grid-area: up; }
            .mobile-btn.down { grid-area: down; }
            .mobile-btn.left { grid-area: left; }
            .mobile-btn.right { grid-area: right; }
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px 50px;
            border-radius: 15px;
            text-align: center;
            color: white;
            display: none;
            z-index: 100;
            border: 2px solid #ef4444;
        }
        .game-over h2 {
            color: #ef4444;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇 🐍</h1>
        <div class="score-board">
            <div class="score-item">分数: <span id="score">0</span></div>
            <div class="score-item">最高: <span id="highScore">0</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <button class="btn-start" id="startBtn">开始游戏</button>
            <button class="btn-pause" id="pauseBtn">暂停</button>
        </div>
        <div class="instructions">
            使用 ↑ ↓ ← → 或 W A S D 控制方向
        </div>
        <div class="mobile-controls">
            <button class="mobile-btn up" data-dir="up">↑</button>
            <button class="mobile-btn left" data-dir="left">←</button>
            <button class="mobile-btn right" data-dir="right">→</button>
            <button class="mobile-btn down" data-dir="down">↓</button>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2>游戏结束!</h2>
        <p>你的分数: <span id="finalScore">0</span></p>
        <button class="btn-start" onclick="restartGame()" style="margin-top: 15px;">重新开始</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop;
        let isPlaying = false;
        let isPaused = false;
        let speed = 100;
        
        document.getElementById('highScore').textContent = highScore;
        
        function drawGame() {
            clearCanvas();
            moveSnake();
            checkCollision();
            drawSnake();
            drawFood();
        }
        
        function clearCanvas() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
        }
        
        function drawSnake() {
            snake.forEach((segment, index) => {
                // 渐变颜色
                const greenValue = Math.max(100, 220 - index * 5);
                ctx.fillStyle = `rgb(74, ${greenValue}, 128)`;
                
                // 圆角矩形
                const x = segment.x * gridSize + 1;
                const y = segment.y * gridSize + 1;
                const size = gridSize - 2;
                
                ctx.beginPath();
                ctx.roundRect(x, y, size, size, 4);
                ctx.fill();
                
                // 蛇头眼睛
                if (index === 0) {
                    ctx.fillStyle = '#fff';
                    const eyeSize = 3;
                    if (dx === 1) {
                        ctx.beginPath();
                        ctx.arc(x + size - 5, y + 5, eyeSize, 0, Math.PI * 2);
                        ctx.arc(x + size - 5, y + size - 5, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (dx === -1) {
                        ctx.beginPath();
                        ctx.arc(x + 5, y + 5, eyeSize, 0, Math.PI * 2);
                        ctx.arc(x + 5, y + size - 5, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (dy === 1) {
                        ctx.beginPath();
                        ctx.arc(x + 5, y + size - 5, eyeSize, 0, Math.PI * 2);
                        ctx.arc(x + size - 5, y + size - 5, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.arc(x + 5, y + 5, eyeSize, 0, Math.PI * 2);
                        ctx.arc(x + size - 5, y + 5, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });
        }
        
        function drawFood() {
            const x = food.x * gridSize;
            const y = food.y * gridSize;
            
            // 食物光晕
            ctx.fillStyle = 'rgba(239, 68, 68, 0.3)';
            ctx.beginPath();
            ctx.arc(x + gridSize/2, y + gridSize/2, gridSize/2 + 3, 0, Math.PI * 2);
            ctx.fill();
            
            // 食物主体
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(x + gridSize/2, y + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            
            // 高光
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(x + gridSize/2 - 3, y + gridSize/2 - 3, 3, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function moveSnake() {
            if (dx === 0 && dy === 0) return;
            
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                generateFood();
                
                // 加速
                if (speed > 50) {
                    speed -= 2;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(drawGame, speed);
                }
            } else {
                snake.pop();
            }
        }
        
        function generateFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }
        
        function checkCollision() {
            const head = snake[0];
            
            // 撞墙
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }
            
            // 撞自己
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }
        }
        
        function gameOver() {
            isPlaying = false;
            clearInterval(gameLoop);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        function startGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            speed = 100;
            document.getElementById('score').textContent = 0;
            document.getElementById('gameOver').style.display = 'none';
            
            generateFood();
            isPlaying = true;
            isPaused = false;
            
            clearInterval(gameLoop);
            gameLoop = setInterval(drawGame, speed);
        }
        
        function restartGame() {
            startGame();
        }
        
        function togglePause() {
            if (!isPlaying) return;
            
            isPaused = !isPaused;
            if (isPaused) {
                clearInterval(gameLoop);
                document.getElementById('pauseBtn').textContent = '继续';
            } else {
                gameLoop = setInterval(drawGame, speed);
                document.getElementById('pauseBtn').textContent = '暂停';
            }
        }
        
        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (!isPlaying || isPaused) return;
            
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
                case ' ':
                    togglePause();
                    break;
            }
        });
        
        // 移动端控制
        document.querySelectorAll('.mobile-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (!isPlaying || isPaused) return;
                
                const dir = btn.dataset.dir;
                switch(dir) {
                    case 'up': if (dy !== 1) { dx = 0; dy = -1; } break;
                    case 'down': if (dy !== -1) { dx = 0; dy = 1; } break;
                    case 'left': if (dx !== 1) { dx = -1; dy = 0; } break;
                    case 'right': if (dx !== -1) { dx = 1; dy = 0; } break;
                }
            });
        });
        
        // 按钮事件
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        
        // 初始绘制
        clearCanvas();
        drawSnake();
        drawFood();
    </script>
</body>
</html>
